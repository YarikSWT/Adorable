<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Adorable — Mobile Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,ital@9..144,400,0;9..144,500,0;9..144,500,1;9..144,600,0&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared.css">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <style>
    body { background: #d8d4cc; padding: 20px 0; min-height: 100vh; }
    /* Device frame to view at desktop comfortably */
    .device {
      width: 375px;
      margin: 0 auto;
      min-height: 812px;
      background:
        radial-gradient(ellipse 120% 80% at 78% 65%,
          var(--coral) 0%,
          var(--coral-soft) 12%,
          #F2A788 28%,
          #F1C5A8 48%,
          var(--cream) 70%,
          var(--paper) 95%);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(42,36,25,.25);
      overflow: hidden;
      position: relative;
      display: flex; flex-direction: column;
    }

    /* === Top bar === */
    .m-top {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      align-items: center;
      padding: 12px 16px;
      background: transparent;
      gap: 8px;
    }
    .m-icon-btn {
      width: 36px; height: 36px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: var(--r-md);
      color: var(--text-primary);
    }
    .m-logo-area {
      display: flex; align-items: center; gap: 8px;
      justify-content: center;
    }
    .m-logo-wordmark { font-size: 18px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em; }
    .m-top-right { display: flex; align-items: center; gap: 6px; }
    .m-bell { position: relative; }
    .m-bell::after {
      content: ""; position: absolute; top: 8px; right: 8px;
      width: 6px; height: 6px; border-radius: 50%; background: var(--brand);
    }
    .m-avatar-pill {
      width: 36px; height: 36px;
      border-radius: var(--r-md);
      background: var(--bg-workspace-pill);
      color: #7B5C32;
      font-size: 12px; font-weight: 600;
      display: inline-flex; align-items: center; justify-content: center;
    }

    /* === Main === */
    .m-main { flex: 1; padding: 32px 16px 24px; display: flex; flex-direction: column; }
    .m-hero {
      text-align: center;
      margin-bottom: 24px;
    }
    .m-hero h1 {
      font-size: 28px;
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: -0.015em;
      line-height: 1.15;
    }

    /* Prompt card */
    .m-prompt {
      background: var(--bg-surface);
      border: 1px solid var(--border-muted);
      border-radius: var(--r-lg);
      padding: 4px;
    }
    .m-prompt-area {
      padding: 14px 16px 6px;
      font-size: 14px;
      color: var(--text-muted);
      min-height: 76px;
    }
    .m-prompt-toolbar {
      display: flex; align-items: center;
      padding: 4px 6px 6px;
    }
    .m-tools-left, .m-tools-right { display: flex; align-items: center; gap: 4px; }
    .m-tools-right { margin-left: auto; gap: 8px; }
    .m-prompt-btn {
      width: 32px; height: 32px;
      border: 1px solid var(--border-default);
      border-radius: var(--r-md);
      background: var(--bg-surface);
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--text-primary);
    }
    .m-switch {
      width: 32px; height: 18px;
      border-radius: 999px;
      background: #E4E4E7;
      position: relative;
    }
    .m-switch::after {
      content: "";
      position: absolute;
      width: 14px; height: 14px;
      top: 2px; left: 2px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0,0,0,.15);
    }
    .m-plan { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-primary); }
    .m-mic, .m-send {
      width: 32px; height: 32px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: var(--r-md);
      color: var(--text-primary);
    }
    .m-mic:hover { background: var(--bg-muted); }
    .m-send { background: #D4D4D4; color: rgba(255,255,255,.6); }

    /* Suggestions */
    .m-suggestions {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-top: 16px; padding: 0 4px;
      justify-content: center;
    }
    .m-suggestion {
      padding: 8px 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border-muted);
      border-radius: var(--r-md);
      font-size: 13px; font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
    }

    /* Cookie banner — fixed bottom */
    .m-cookie {
      margin: 24px 12px 16px;
      padding: 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--r-lg);
      box-shadow: var(--sh-lg);
      text-align: center;
    }
    .m-cookie-text { font-size: 13px; color: var(--text-primary); line-height: 1.45; margin-bottom: 14px; }
    .m-cookie-text a { text-decoration: underline; }
    .m-cookie-btns { display: flex; flex-direction: column; gap: 8px; }
    .m-cookie-btn { padding: 10px; border: 1px solid var(--border-default); border-radius: var(--r-pill); font-size: 13px; font-weight: 500; background: var(--bg-surface); }
    .m-cookie-foot { font-size: 10px; color: var(--text-muted); margin-top: 12px; }
  </style>
</head>
<body>
  <div class="device">
    <!-- Top bar -->
    <header class="m-top">
      <button class="m-icon-btn" aria-label="Menu"><i data-lucide="menu" width="20" height="20"></i></button>
      <div class="m-logo-area">
        <svg width="22" height="18" viewBox="0 0 28 22" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="6" y1="3" x2="22" y2="3" stroke="#FF631F" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="4" y1="7" x2="24" y2="7" stroke="#FF631F" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M3 21 A11 11 0 0 1 25 21 Z" fill="#FF631F"/>
        </svg>
        <span class="m-logo-wordmark">Adorable</span>
      </div>
      <div class="m-top-right">
        <button class="m-icon-btn m-bell"><i data-lucide="bell" width="18" height="18"></i></button>
        <button class="m-avatar-pill">Yw</button>
      </div>
    </header>

    <main class="m-main">
      <section class="m-hero">
        <h1>What will you build next?</h1>
      </section>

      <div class="m-prompt">
        <div class="m-prompt-area">Describe the app you want to create...</div>
        <div class="m-prompt-toolbar">
          <div class="m-tools-left">
            <button class="m-prompt-btn"><i data-lucide="plus" width="14" height="14"></i></button>
            <button class="m-prompt-btn"><i data-lucide="workflow" width="14" height="14"></i></button>
            <button class="m-prompt-btn"><i data-lucide="sliders-horizontal" width="14" height="14"></i></button>
          </div>
          <div class="m-tools-right">
            <span class="m-plan">Plan <span class="m-switch"></span></span>
            <button class="m-mic"><i data-lucide="mic" width="14" height="14"></i></button>
            <button class="m-send"><i data-lucide="arrow-right" width="14" height="14"></i></button>
          </div>
        </div>
      </div>

      <div class="m-suggestions">
        <button class="m-suggestion">Tasks &amp; Workflows</button>
        <button class="m-suggestion">CRM &amp; Sales</button>
        <button class="m-suggestion">Content &amp; Sites</button>
        <button class="m-suggestion">Finance</button>
        <button class="m-suggestion">Booking</button>
        <button class="m-suggestion">...</button>
      </div>

      <aside class="m-cookie" role="dialog">
        <p class="m-cookie-text">
          We use essential and non-essential cookies. You can accept all, deny all or manage your preferences. Learn more: <a href="#">privacy policy</a>.
        </p>
        <div class="m-cookie-btns">
          <button class="m-cookie-btn">Accept all</button>
          <button class="m-cookie-btn">Manage preferences</button>
          <button class="m-cookie-btn">Deny</button>
        </div>
        <div class="m-cookie-foot">Powered by Usercentrics Consent Management</div>
      </aside>
    </main>
  </div>

  <script>
    if (window.lucide && typeof lucide.createIcons === 'function') lucide.createIcons();
    else window.addEventListener('load', () => lucide && lucide.createIcons && lucide.createIcons());
  </script>
</body>
</html>
